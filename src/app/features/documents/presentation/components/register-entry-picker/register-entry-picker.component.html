<div
  role="radiogroup"
  aria-label="Tipo de ingreso"
  class="grid grid-cols-1 gap-4"
  [class.md:grid-cols-3]="facade.entryCards().length === 3"
  [class.md:grid-cols-2]="facade.entryCards().length === 2"
>
  @for (card of facade.entryCards(); track card.value) {
    @let on = facade.entry() === card.value;
    <button
      type="button"
      role="radio"
      class="option-card relative flex items-start gap-3.5 rounded-2xl border-2 px-5 py-[18px] text-left text-ink transition-[border-color,box-shadow]"
      [class]="on ? 'border-primary bg-primary-tint shadow-option' : 'border-line bg-white'"
      [class.opacity-55]="facade.locked() && !on"
      [class.cursor-default]="facade.locked()"
      [attr.aria-checked]="on"
      [attr.aria-disabled]="facade.locked() && !on"
      (click)="facade.pickEntry(card.value)"
    >
      <span
        class="flex size-[46px] shrink-0 items-center justify-center rounded-xl"
        [class]="on ? 'bg-primary text-white' : 'bg-page text-primary'"
      >
        <app-icon [name]="card.icon" [size]="22" />
      </span>
      <span class="flex flex-col gap-1 pr-[26px]">
        <span class="text-base font-bold">{{ card.label }}</span>
        <span class="text-[13px] leading-normal text-muted">{{ card.description }}</span>
      </span>
      <span
        class="absolute top-4 right-4 flex size-[22px] items-center justify-center rounded-full border-2 text-white"
        [class]="on ? 'border-primary bg-primary' : 'border-control bg-white'"
      >
        @if (on) {
          <app-icon name="check" [size]="12" [stroke]="3" />
        }
      </span>
    </button>
  }
</div>
