<app-page-header
  heading="Áreas"
  description="Unidades internas de cada sociedad. Los usuarios internos (aprobadores, contabilidad) pertenecen a un área."
>
  <button type="button" class="btn btn-primary" (click)="facade.openNew()">
    <app-icon name="plus" [size]="18" [stroke]="2.2" />Nueva área
  </button>
</app-page-header>

<section aria-label="Filtros" class="card relative z-10 flex flex-col gap-4 px-6 py-[22px]">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-[2fr_1.4fr_1fr]">
    <div class="flex flex-col gap-2">
      <label for="cf-q" class="field-label">Buscar</label>
      <div class="relative flex">
        <app-icon
          name="search"
          [size]="18"
          class="pointer-events-none absolute top-[13px] left-3 text-muted"
        />
        <input
          id="cf-q"
          type="search"
          class="field pl-[38px]"
          placeholder="Nombre o descripción del área"
          [value]="facade.draft().search"
          (input)="facade.setDraft({ search: $any($event.target).value })"
          (keyup.enter)="facade.search()"
        />
      </div>
    </div>
    <app-select
      label="Sociedad"
      [options]="facade.societyFilterOptions()"
      [value]="facade.draft().societyId"
      (valueChange)="facade.setDraft({ societyId: $event })"
    />
    <app-select
      label="Estado"
      [options]="facade.statusOptions"
      [value]="facade.draft().status"
      (valueChange)="facade.setDraft({ status: $any($event) })"
    />
  </div>
  <div class="flex justify-end gap-2.5 border-t border-line-soft pt-4">
    <button type="button" class="btn btn-secondary" (click)="facade.clear()">Limpiar</button>
    <button type="button" class="btn btn-primary min-w-[132px]" (click)="facade.search()">
      <app-icon name="search" [size]="18" [stroke]="2" />Buscar
    </button>
  </div>
</section>

@if (facade.loadError()) {
  <app-callout tone="danger">{{ facade.loadError() }}</app-callout>
}

<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
  <app-kpi-card
    label="Total de áreas"
    icon="layers"
    tone="primary"
    [loading]="facade.loading()"
    [value]="facade.kpis().total"
  />
  <app-kpi-card
    label="Activas"
    icon="circle-check"
    tone="success"
    [loading]="facade.loading()"
    [value]="facade.kpis().active"
  />
  <app-kpi-card
    label="Inactivas"
    icon="power"
    tone="gray"
    [loading]="facade.loading()"
    [value]="facade.kpis().inactive"
  />
</div>

<section
  aria-label="Áreas"
  class="card flex grow flex-col overflow-hidden"
  [attr.aria-busy]="facade.loading()"
>
  <app-area-table
    [rows]="facade.pageRows()"
    [loading]="facade.loading()"
    (edit)="facade.openEdit($event)"
    (toggle)="facade.confirming.set($event)"
  />

  @if (!facade.loading() && !facade.rows().length && !facade.loadError()) {
    <app-empty-state
      heading="No encontramos áreas"
      text="Prueba con otro texto de búsqueda o cambia los filtros."
      icon="layers"
      (action)="facade.clear()"
    />
  }

  <app-pagination
    [loading]="facade.loading()"
    loadingText="Cargando áreas…"
    [total]="facade.rows().length"
    [page]="facade.page()"
    [pageSize]="facade.pageSize"
    noun="áreas"
    (pageChange)="facade.page.set($event)"
  />
</section>

@if (facade.editing()) {
  <app-area-form-drawer />
}

@if (facade.confirming(); as area) {
  <app-confirm-dialog
    [heading]="(area.isActive ? '¿Desactivar' : '¿Activar') + ' el área?'"
    [text]="facade.confirmText(area)"
    [confirmText]="area.isActive ? 'Desactivar' : 'Activar'"
    [danger]="area.isActive"
    [busy]="facade.toggling()"
    (cancel)="facade.confirming.set(null)"
    (confirm)="facade.toggle()"
  />
}
