<div class="portal-shell" [class.menu-collapsed]="menuOpen()">
  <header class="portal-header">
    <button class="portal-menu-toggle" (click)="menuOpen.set(!menuOpen())">
      <i class="bx bx-menu"></i>
    </button>
    <div class="portal-breadcrumb">
      <span>Portal</span><i class="bx bx-chevron-right"></i><strong>{{ screenLabel() }}</strong>
    </div>
    <div class="portal-header-actions">
      <button class="portal-icon-button" aria-label="Notificaciones">
        <i class="bx bx-bell"></i><em></em>
      </button>
      <button class="portal-icon-button" aria-label="Ayuda">
        <i class="bx bx-help-circle"></i>
      </button>
      <label *ngIf="(auth.user()?.roles?.length || 0) > 1" class="active-role-selector">
        <span>Trabajando como</span>
        <select [ngModel]="auth.user()?.role" (ngModelChange)="setActiveRole($event)">
          <option *ngFor="let role of auth.user()?.roles" [value]="role">
            {{ roleLabel(role) }}
          </option>
        </select>
      </label>
      <div class="portal-user-actions">
        <button
          class="portal-user-menu"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen()"
        >
          <span class="portal-profile-badge">{{ initials() }}</span
          ><span class="portal-profile-data"
            ><b>{{ auth.user()?.name }}</b
            ><small>RUC {{ auth.user()?.providerId }}</small></span
          ><i class="bx bx-chevron-down"></i>
        </button>
        <div *ngIf="userMenuOpen()" class="portal-user-dropdown">
          <button (click)="navigate('perfil')"><i class="bx bx-user"></i> Mi perfil</button>
          <button (click)="logout()"><i class="bx bx-log-out"></i> Cerrar sesión</button>
        </div>
      </div>
      <button
        class="portal-header-control"
        type="button"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()"
      >
        <i class="bx bx-log-out"></i>
      </button>
    </div>
  </header>
  <aside class="portal-sidebar">
    <div class="portal-sidebar-brand">
      <span class="portal-brand-cube"><i class="bx bxs-cube"></i></span
      ><strong>Portal de<br />Proveedores</strong>
    </div>
    <nav>
      <button [class.active]="screen() === 'dashboard'" (click)="navigate('dashboard')">
        <i class="portal-nav-icon bx bx-home"></i><span>Inicio</span></button
      ><button
        *ngIf="isRole('Proveedor') || isRole('Administrador')"
        [class.active]="screen() === 'registrar'"
        (click)="navigate('registrar')"
      >
        <i class="portal-nav-icon bx bx-cart"></i><span>Orden de compra</span
        ><i class="portal-nav-chevron bx bx-chevron-right"></i></button
      ><button
        *ngIf="isRole('Proveedor') || isRole('Administrador')"
        [class.active]="screen() === 'consultas'"
        (click)="navigate('documentos')"
      >
        <i class="portal-nav-icon bx bx-money"></i><span>Orden de pago</span></button
      ><button
        *ngIf="isRole('Proveedor') || isRole('Administrador')"
        [class.active]="screen() === 'consultas'"
        (click)="navigate('documentos')"
      >
        <i class="portal-nav-icon bx bx-file"></i><span>Estado de factura</span></button
      ><button
        *ngIf="isRole('Proveedor') || isRole('Administrador')"
        [class.active]="screen() === 'documentos'"
        (click)="navigate('documentos')"
      >
        <i class="portal-nav-icon bx bx-file-blank"></i><span>Documentos</span></button
      ><button
        *ngIf="isRole('Proveedor') || isRole('CxP') || isRole('Administrador')"
        [class.active]="screen() === 'contabilizacion'"
        (click)="navigate('contabilizacion')"
      >
        <i class="portal-nav-icon bx bx-bar-chart-alt-2"></i><span>Contabilización</span></button
      ><button
        *ngIf="isRole('Colaborador interno')"
        [class.active]="screen() === 'registrar'"
        (click)="navigate('registrar')"
      >
        <i class="portal-nav-icon bx bx-file-plus"></i><span>Documentos especiales</span></button
      ><button
        *ngIf="isRole('Área Usuaria')"
        [class.active]="screen() === 'aprobaciones'"
        (click)="navigate('aprobaciones')"
      >
        <i class="portal-nav-icon bx bx-check-shield"></i><span>Aprobaciones</span></button
      ><button
        *ngIf="isRole('Administrador')"
        [class.active]="screen() === 'usuarios'"
        (click)="navigate('usuarios')"
      >
        <i class="portal-nav-icon bx bx-cog"></i><span>Configuración</span
        ><i class="portal-nav-chevron bx bx-chevron-down"></i>
      </button>
      <button
        *ngIf="isRole('Administrador')"
        class="configuration-item"
        [class.active]="screen() === 'usuarios'"
        (click)="navigate('usuarios')"
      >
        <i class="portal-configuration-dot"></i><span>Usuarios y roles</span>
      </button>
    </nav>
  </aside>
  <main class="portal-content">
    <div
      class="portal-content-inner"
      [class.legacy-ui]="
        screen() !== 'dashboard' &&
        screen() !== 'documentos' &&
        screen() !== 'registrar' &&
        screen() !== 'usuarios' &&
        screen() !== 'contabilizacion' &&
        screen() !== 'aprobaciones' &&
        screen() !== 'workflows' &&
        screen() !== 'perfil'
      "
    >
      <ng-content></ng-content>
    </div>
  </main>
</div>
