<header
  class="sticky top-0 z-30 flex h-[68px] shrink-0 items-center justify-between gap-3 border-b border-line bg-white px-4 sm:px-10 print:hidden"
>
  <div class="flex min-w-0 items-center gap-3.5">
    <button
      type="button"
      class="ripple flex size-10 shrink-0 items-center justify-center rounded-full border border-line-auth bg-white text-ink hover:bg-page touch-target"
      [attr.aria-label]="layout.navOpen() ? 'Ocultar menú' : 'Mostrar menú'"
      [attr.aria-expanded]="layout.navOpen()"
      (click)="layout.toggleNav()"
    >
      <app-icon name="menu" [size]="20" [stroke]="2" />
    </button>
    <div class="hidden truncate text-body-m text-muted sm:block">
      Portal <span class="mx-1.5 text-faint">/</span>
      <span class="font-medium text-ink">{{ pageTitle() }}</span>
    </div>
  </div>

  <div class="flex items-center gap-1 sm:gap-2">
    <button
      type="button"
      class="ripple relative hidden size-10 items-center justify-center rounded-full text-label hover:bg-page sm:flex touch-target"
      aria-label="Notificaciones"
      (click)="notImplemented('Las notificaciones')"
    >
      <app-icon name="bell" [size]="20" />
      <span
        class="absolute top-2.5 right-[11px] size-2 rounded-full border-2 border-white bg-notify-dot"
      ></span>
    </button>
    <button
      type="button"
      class="ripple hidden size-10 items-center justify-center rounded-full text-label hover:bg-page sm:flex touch-target"
      aria-label="Ayuda"
      (click)="notImplemented('La guía de uso')"
    >
      <app-icon name="help" [size]="20" />
    </button>
    <span class="mx-2 hidden h-7 w-px bg-line sm:block"></span>
    <div class="flex items-center gap-2.5">
      <a
        routerLink="/perfil"
        class="ripple flex min-w-0 items-center gap-2.5 rounded-full py-1 pr-1.5 text-ink no-underline hover:bg-page"
        data-tooltip="Mi perfil"
      >
        <span
          class="flex size-[38px] shrink-0 items-center justify-center rounded-full bg-primary text-title-s text-white"
          >{{ userInitials() }}</span
        >
        <span class="hidden min-w-0 flex-col md:flex">
          <span class="max-w-[220px] truncate text-title-s">{{ session.user()?.name }}</span>
          <span class="truncate text-body-s tracking-[0.01em] text-muted tabular-nums">{{
            userCaption()
          }}</span>
        </span>
      </a>
      <button
        type="button"
        class="ripple flex size-10 items-center justify-center rounded-full text-muted hover:bg-page touch-target"
        aria-label="Cerrar sesión"
        data-tooltip="Cerrar sesión"
        (click)="logout()"
      >
        <app-icon name="logout" [size]="18" />
      </button>
    </div>
  </div>
</header>
