<span
  class="flex size-11 shrink-0 items-center justify-center rounded-shape-md"
  [class]="iconClass()"
>
  <app-icon [name]="icon()" [size]="22" />
</span>
<div class="flex min-w-0 grow flex-col">
  <span class="text-body-m text-muted">{{ label() }}</span>
  @if (loading()) {
    <span class="skeleton h-[22px] w-[36%]"></span>
  } @else {
    <span class="animate-fade truncate text-title-l font-bold tabular-nums">{{ value() }}</span>
  }
</div>
