<div class="animate-fade fixed inset-0 z-50 flex items-center justify-center bg-scrim px-4">
  <div
    role="alertdialog"
    aria-modal="true"
    appFocusTrap
    aria-labelledby="confirm-title"
    class="animate-pop flex w-full max-w-[480px] outline-none flex-col gap-3.5 rounded-shape-xl bg-white p-7 shadow-dialog"
  >
    <span
      class="flex size-14 items-center justify-center rounded-full"
      [class]="
        danger() ? 'bg-danger-soft-alt text-danger-text' : 'bg-success-soft text-success-text'
      "
    >
      <app-icon name="power" [size]="26" [stroke]="2" />
    </span>
    <h2 id="confirm-title" class="m-0 text-title-l font-medium">{{ heading() }}</h2>
    <p class="m-0 text-body-m leading-relaxed text-body">{{ text() }}</p>
    <div class="mt-1.5 flex justify-end gap-2.5">
      <button type="button" class="btn btn-secondary" [disabled]="busy()" (click)="cancel.emit()">
        Cancelar
      </button>
      <button
        type="button"
        class="btn text-white"
        [class]="
          danger()
            ? 'bg-danger-text hover:bg-danger-hover'
            : 'bg-success-text hover:bg-success-deep'
        "
        [attr.aria-busy]="busy()"
        (click)="!busy() && confirm.emit()"
      >
        @if (busy()) {
          <app-spinner [size]="18" />
        }
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
