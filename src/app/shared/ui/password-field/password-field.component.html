<label [for]="inputId()" class="text-title-s text-ink">{{ label() }}</label>
<div class="relative flex">
  <app-icon
    name="lock"
    [size]="20"
    class="pointer-events-none absolute top-[15px] left-4 text-body-auth"
  />
  <input
    [id]="inputId()"
    [type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
    [attr.aria-invalid]="invalid()"
    class="h-12 grow rounded-shape-xs border bg-white pr-[52px] pl-12 text-body-l text-ink outline-none focus:field-focus-ring"
    [class.border-field-auth]="!invalid()"
    [class.border-danger-field]="invalid()"
  />
  <button
    type="button"
    class="ripple absolute top-1 right-1 flex size-10 items-center justify-center rounded-full text-body-auth hover:bg-page"
    [attr.aria-label]="
      visible() ? 'Ocultar ' + label().toLowerCase() : 'Mostrar ' + label().toLowerCase()
    "
    (click)="visible.set(!visible())"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="20" />
  </button>
</div>
