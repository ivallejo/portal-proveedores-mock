<span
  class="flex size-[52px] shrink-0 items-center justify-center rounded-shape-md"
  [class]="success() ? 'bg-success-soft text-success-strong' : 'bg-primary-soft text-primary'"
>
  <app-icon [name]="icon()" [size]="26" />
</span>
<div class="flex flex-col gap-1.5">
  <h2 class="m-0 text-headline-s font-medium text-ink sm:text-headline-m">
    {{ heading() }}
  </h2>
  <p class="m-0 text-body-l leading-relaxed text-body-auth"><ng-content /></p>
</div>
