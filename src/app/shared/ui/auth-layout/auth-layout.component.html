<div class="relative flex h-dvh overflow-hidden bg-page text-ink">
  <div class="absolute -top-[220px] -right-[180px] size-[560px] rounded-full bg-[#E1ECFC]"></div>
  <div class="absolute -right-[120px] -bottom-[260px] size-[480px] rounded-full bg-[#E4EEFD]"></div>

  <div class="relative flex h-full w-full overflow-hidden bg-surface-auth">
    <aside
      class="bg-brand-gradient relative hidden w-[46%] max-w-[640px] shrink-0 overflow-hidden text-white lg:block"
    >
      <svg
        width="640"
        height="190"
        viewBox="0 0 640 190"
        fill="none"
        class="absolute bottom-0 left-0 w-full"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          d="M0 70c80-34 160-34 240 0s160 34 240 0 120-28 160-14V190H0z"
          fill="#FFFFFF"
          fill-opacity="0.05"
        />
        <path
          d="M0 108c70-28 150-30 230 0s170 30 250 0 120-22 160-10V190H0z"
          fill="#FFFFFF"
          fill-opacity="0.06"
        />
        <path
          d="M0 146c80-22 160-22 240 0s170 22 250 0 110-16 150-8V190H0z"
          fill="#061E50"
          fill-opacity="0.22"
        />
        <path
          d="M0 70c80-34 160-34 240 0s160 34 240 0 120-28 160-14"
          stroke="#A9CBFF"
          stroke-opacity="0.35"
          stroke-width="1.5"
        />
      </svg>
      <svg
        width="520"
        height="520"
        viewBox="0 0 520 520"
        fill="none"
        class="absolute top-40 -right-[260px]"
        aria-hidden="true"
      >
        <circle cx="260" cy="260" r="258" fill="#2A78EA" fill-opacity="0.35" />
      </svg>

      <div class="relative flex flex-col items-center gap-7 px-12 pt-9 text-center">
        <div
          role="group"
          aria-label="Empresas del grupo"
          class="flex items-center justify-center gap-[22px] rounded-[18px] border border-white/16 bg-white/8 px-[26px] py-4"
        >
          @for (logo of groupLogos; track logo.src; let last = $last) {
            <img [src]="logo.src" [alt]="logo.alt" class="block w-auto" [class]="logo.height" />
            @if (!last) {
              <span class="h-10 w-px shrink-0 bg-white/28" aria-hidden="true"></span>
            }
          }
        </div>
        <div class="flex flex-col items-center gap-3">
          <img src="images/grupo/emblema.png" alt="" class="block h-auto w-[150px]" />
          <h1 class="m-0 text-[40px] leading-[1.1] font-bold tracking-tight">
            Portal de Proveedores
          </h1>
          @if (description()) {
            <p class="m-0 max-w-[460px] text-[16.5px] leading-[1.55] text-[#E3EDFF]">
              {{ description() }}
            </p>
          }
        </div>
        <ul aria-label="Beneficios" class="m-0 flex w-full list-none flex-col gap-3 p-0 text-left">
          @for (benefit of benefits; track benefit) {
            <li
              class="flex h-[62px] items-center gap-4 rounded-[14px] border border-white/16 bg-white/10 px-[22px] text-[17px] font-medium backdrop-blur-[6px]"
            >
              <span
                class="size-3 shrink-0 rounded-full bg-[#6FB1FF] shadow-[0_0_0_4px_rgba(111,177,255,0.28)]"
                aria-hidden="true"
              ></span
              >{{ benefit }}
            </li>
          }
        </ul>
      </div>

      <div class="absolute bottom-8 left-14 flex items-center gap-2.5 text-sm font-medium">
        <app-icon name="shield-check" [size]="20" />Tu proveedor, nuestro aliado
      </div>
    </aside>

    <div class="flex grow items-center justify-center overflow-y-auto px-4 py-4 sm:px-8">
      <div
        class="flex w-full max-w-[500px] flex-col gap-5 rounded-[20px] bg-white px-6 pt-9 pb-[30px] shadow-auth-card sm:px-[52px]"
      >
        <ng-content />
        <div class="flex items-center justify-center gap-2 pt-0.5 text-[13px] text-muted-auth">
          <app-icon name="shield-check" [size]="16" />Protegemos tu información
        </div>
      </div>
    </div>
  </div>
</div>
