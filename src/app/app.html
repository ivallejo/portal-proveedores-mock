<app-login *ngIf="!auth.user(); else portal"></app-login>
<ng-template #portal>
  <app-portal-shell [error]="error()" (navigateTo)="navigate($event)" (loggedOut)="logout()">
    <div *ngIf="error()" class="toast error"><i class="bx bx-error-circle"></i>{{ error() }}</div>
    <app-dashboard
      *ngIf="screen() === 'dashboard'"
      [userName]="auth.user()?.name || ''"
      [isProvider]="isRole('Proveedor')"
      [documents]="providerDocuments()"
      [loading]="loading()"
      [pendingCount]="pendingCount()"
      [approvedCount]="approvedCount()"
      [rejectedCount]="rejectedCount()"
      (navigate)="navigate($event)"
    ></app-dashboard>
    <section *ngIf="screen() === 'perfil'" class="page profile-page">
      <app-profile></app-profile>
    </section>
    <app-workflows-page *ngIf="screen() === 'workflows'" [controller]="this"></app-workflows-page>
    <app-registration
      *ngIf="screen() === 'registrar'"
      (navigateTo)="navigate($event)"
    ></app-registration>
    <app-documents-list *ngIf="screen() === 'documentos'" [controller]="this"></app-documents-list>
    <app-approvals-page
      *ngIf="screen() === 'aprobaciones'"
      [controller]="this"
    ></app-approvals-page>
    <app-accounting-page
      *ngIf="screen() === 'contabilizacion'"
      [controller]="this"
    ></app-accounting-page>
    <app-admin-users
      *ngIf="screen() === 'usuarios'"
      (close)="navigate('dashboard')"
    ></app-admin-users>
  </app-portal-shell>
</ng-template>
