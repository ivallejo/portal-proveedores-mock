<app-login *ngIf="!portal.auth.user(); else portalView"></app-login>
<ng-template #portalView>
  <app-portal-shell
    [class.legacy-ui]="
      portal.screen() !== 'dashboard' &&
      portal.screen() !== 'documentos' &&
      portal.screen() !== 'registrar'
    "
    [error]="portal.error()"
    (navigateTo)="portal.navigate($event)"
    (loggedOut)="portal.logout()"
  >
    <div *ngIf="portal.error()" class="toast error">
      <i class="bx bx-error-circle"></i>{{ portal.error() }}
    </div>
    <app-dashboard
      *ngIf="portal.screen() === 'dashboard'"
      [userName]="portal.auth.user()?.name || ''"
      (navigate)="portal.navigate($event)"
    ></app-dashboard>
    <section *ngIf="portal.screen() === 'perfil'" class="page profile-page">
      <app-profile></app-profile>
    </section>
    <app-workflows-page *ngIf="portal.screen() === 'workflows'"></app-workflows-page>
    <app-registration
      *ngIf="portal.screen() === 'registrar'"
      (navigateTo)="portal.navigate($event)"
    ></app-registration>
    <app-documents-list *ngIf="portal.screen() === 'documentos'"></app-documents-list>
    <app-approvals-page *ngIf="portal.screen() === 'aprobaciones'"></app-approvals-page>
    <app-accounting-page *ngIf="portal.screen() === 'contabilizacion'"></app-accounting-page>
    <app-admin-users
      *ngIf="portal.screen() === 'usuarios'"
      (close)="portal.navigate('dashboard')"
    ></app-admin-users>
  </app-portal-shell>
</ng-template>
